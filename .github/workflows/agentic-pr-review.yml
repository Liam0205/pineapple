name: Agentic PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "llmdoc/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  pr-review:
    uses: Lightspeed-Intelligence/agentic-workflow-template/.github/workflows/pr-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      FEISHU_WEBHOOK_TOKEN: ${{ secrets.FEISHU_WEBHOOK_TOKEN }}
    with:
      use_feishu_notify: true
      # Give the reviewer this project's own toolchain. Without it the runner
      # has no ruff or golangci-lint and a JDK that rejects our release 25, so
      # the reviewer can only read code — the checks most likely to catch a
      # real defect are exactly the ones it cannot run. Failure is not fatal;
      # the agent is told which capabilities are missing and discloses them.
      setup_script: .github/agentic/setup.sh
